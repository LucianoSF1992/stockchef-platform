<div class="login-page">
    <mat-card class="login-card">
        <div class="login-header">
            <div class="logo">
                <mat-icon>inventory_2</mat-icon>
            </div>

            <h1>StockChef</h1>

            <p>Gestão inteligente de estoque</p>
        </div>

        <form class="login-form">
            <mat-form-field appearance="outline">
                <mat-label>E-mail</mat-label>

                <input matInput type="email" placeholder="seu@email.com" />

                <mat-icon matPrefix>email</mat-icon>
            </mat-form-field>

            <mat-form-field appearance="outline">
                <mat-label>Senha</mat-label>

                <input matInput type="password" placeholder="Digite sua senha" />

                <mat-icon matPrefix>lock</mat-icon>
            </mat-form-field>

            <button mat-flat-button color="primary" type="submit" class="login-button">
                Entrar
            </button>
        </form>

        <div class="login-footer">
            <span>StockChef Platform</span>
        </div>
    </mat-card>
</div>
