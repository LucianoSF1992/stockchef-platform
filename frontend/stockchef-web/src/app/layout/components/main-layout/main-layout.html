<mat-sidenav-container class="layout-container">
    <mat-sidenav #sidenav class="sidenav" mode="side" opened>
        <div class="sidenav-header">
            <span class="logo">StockChef</span>
        </div>

        <mat-nav-list>
            <a mat-list-item routerLink="/dashboard">
                <mat-icon matListItemIcon>dashboard</mat-icon>
                <span matListItemTitle>Dashboard</span>
            </a>

            <a mat-list-item routerLink="/products">
                <mat-icon matListItemIcon>inventory_2</mat-icon>
                <span matListItemTitle>Produtos</span>
            </a>

            <a mat-list-item routerLink="/categories">
                <mat-icon matListItemIcon>category</mat-icon>
                <span matListItemTitle>Categorias</span>
            </a>

            <a mat-list-item routerLink="/suppliers">
                <mat-icon matListItemIcon>local_shipping</mat-icon>
                <span matListItemTitle>Fornecedores</span>
            </a>

            <a mat-list-item routerLink="/inventory">
                <mat-icon matListItemIcon>warehouse</mat-icon>
                <span matListItemTitle>Estoque</span>
            </a>

            <a mat-list-item routerLink="/reports">
                <mat-icon matListItemIcon>assessment</mat-icon>
                <span matListItemTitle>Relatórios</span>
            </a>
        </mat-nav-list>
    </mat-sidenav>

    <mat-sidenav-content>
        <mat-toolbar class="toolbar">
            <button mat-icon-button type="button" aria-label="Alternar menu" (click)="sidenav.toggle()">
                <mat-icon>menu</mat-icon>
            </button>

            <span class="toolbar-title">StockChef</span>

            <span class="toolbar-spacer"></span>

            <button mat-icon-button type="button" aria-label="Notificações">
                <mat-icon>notifications</mat-icon>
            </button>

            <button mat-icon-button type="button" aria-label="Perfil">
                <mat-icon>account_circle</mat-icon>
            </button>
        </mat-toolbar>

        <main class="content">
            <router-outlet></router-outlet>
        </main>
    </mat-sidenav-content>
</mat-sidenav-container>
